# CI Pipeline for sloosh iOS
name: iOS Build

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
      - 'database.rules.json'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.gitignore'
      - 'database.rules.json'
  workflow_dispatch:

jobs:
  # Lint запускается параллельно только для PR, не блокирует сборку
  lint:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-swiftlint-${{ runner.os }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          cd sloosh-iOS
          swiftlint lint --reporter github-actions-logging
        continue-on-error: true

  build:
    runs-on: macos-15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          if ! which xcodegen > /dev/null 2>&1; then
            echo "Downloading XcodeGen binary release..."
            if curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o /tmp/xcodegen.zip; then
              unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
              sudo cp /tmp/xcodegen/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
              sudo cp -r /tmp/xcodegen/xcodegen/share/xcodegen /usr/local/share/ 2>/dev/null || true
              rm -rf /tmp/xcodegen /tmp/xcodegen.zip
            else
              echo "Fallback to Homebrew with no update..."
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
            fi
          fi
          xcodegen --version

      - name: Inject Build Number
        run: |
          cd sloosh-iOS
          sed -i '' "s/890/${{ github.run_number }}/g" project.yml
          sed -i '' "s/890/${{ github.run_number }}/g" sloosh/Info.plist
          # Read base marketing version (e.g. "1.5") BEFORE any modification
          BASE_VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" sloosh/Info.plist)
          FULL_VER="${BASE_VER}.${{ github.run_number }}"
          echo "FULL_VER=$FULL_VER" >> $GITHUB_ENV
          # Patch project.yml so xcodegen picks up the full version
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $FULL_VER/" project.yml

      - name: Inject App Secrets
        run: |
          cd sloosh-iOS
          sed -i '' "s/apiKey: String = \"\"/apiKey: String = \"${{ secrets.SLOOSH_API_KEY }}\"/" sloosh/Sources/Data/Network/AppSecrets.swift

      - name: Generate Xcode Project
        run: |
          cd sloosh-iOS
          xcodegen generate

      - name: Patch Version After XcodeGen
        run: |
          cd sloosh-iOS
          # Unconditionally force the correct version regardless of what xcodegen produced
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $FULL_VER" sloosh/Info.plist
          echo "Final CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' sloosh/Info.plist)"


      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: sloosh-iOS/build
          key: deriveddata-v2-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            deriveddata-v2-${{ runner.os }}-

      - name: Build iOS App
        run: |
          cd sloosh-iOS
          xcodebuild build \
            -project sloosh.xcodeproj \
            -scheme sloosh \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath ./build \
            -parallelizeTargets \
            -jobs $(sysctl -n hw.ncpu) \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_COMPILATION_MODE=singlefile \
            -showBuildTimingSummary \
            -quiet

      - name: Package IPA (Unsigned)
        run: |
          cd sloosh-iOS
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/sloosh.app Payload/
          zip -q -1 -r sloosh.ipa Payload

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Development Build #${{ github.run_number }}
          body: |
            Auto-generated IPA build from the latest commit.
            **Note:** This is an unsigned IPA file. You need to use tools like TrollStore, AltStore, or SideStore to install it.
          files: sloosh-iOS/sloosh.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AltStore JSON
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p altstore
          SIZE=$(stat -f%z sloosh-iOS/sloosh.ipa || echo 0)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # FULL_VER is set in GITHUB_ENV by "Inject Build Number" step (e.g. "1.5.1097")
          cat <<EOF > altstore/apps.json
          {
            "name": "sloosh repo",
            "identifier": "com.sloosh.ios.repo",
            "sourceURL": "https://sluvskii.github.io/iOS-sloosh/apps.json",
            "apps": [
              {
                "name": "sloosh",
                "bundleIdentifier": "com.sloosh.ios",
                "developerName": "sluvskii",
                "version": "$FULL_VER",
                "versionDate": "$DATE",
                "versionDescription": "Build #${{ github.run_number }}",
                "downloadURL": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/sloosh.ipa",
                "localizedDescription": "sloosh — стриминг фильмов и сериалов",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/sloosh-iOS/sloosh/Resources/Assets.xcassets/AppIcon.appiconset/light.png",
                "tintColor": "000000",
                "size": $SIZE
              }
            ]
          }
          EOF

      - name: Upload Pages Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./altstore

  deploy-altstore:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
