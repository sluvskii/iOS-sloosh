<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>sloosh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ios-app" id="app">
    
    <div class="screen screen-main active" id="screenHome">
      <header class="ios-nav-header">
        <div class="nav-logo-row">
          <img class="sloosh-logo-img" src="logo.svg" alt="sloosh">
        </div>
        <div class="category-tabs" id="categoryTabs">
          <button class="tab-pill active" data-cat="all">Все</button>
          <button class="tab-pill" data-cat="movie">Фильмы</button>
          <button class="tab-pill" data-cat="tv">Сериалы</button>
          <button class="tab-pill" data-cat="cartoon">Мульты</button>
          <button class="tab-pill" data-cat="anime">Аниме</button>
        </div>
        <div class="filter-row" id="filterRow">
          <button class="filter-pill active" data-filter="popular">Смотрят сейчас</button>
          <button class="filter-pill" data-filter="top">По рейтингу</button>
        </div>
      </header>

      <div class="scroll-container" id="homeScroll">
        <div class="poster-grid" id="homeGrid"></div>
      </div>
    </div>

    <div class="screen screen-main" id="screenSearch">
      <header class="ios-nav-header">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Поиск фильмов и сериалов" autocomplete="off">
          <button class="search-clear-btn" id="searchClear" style="display:none;">✕</button>
        </div>
      </header>

      <div class="scroll-container">
        <div class="poster-grid" id="searchGrid"></div>
        <div class="empty-state" id="searchEmptyState" style="display:none;">
          <p class="empty-title">Ничего не найдено</p>
          <p class="empty-desc">Проверьте правильность написания названия</p>
        </div>
      </div>
    </div>

    <div class="screen screen-main" id="screenBookmarks">
      <header class="ios-nav-header">
        <div class="nav-title-row">
          <h1 class="screen-title">Закладки</h1>
          <span class="counter-badge" id="bookmarksCounter">0</span>
        </div>
      </header>

      <div class="scroll-container">
        <div class="poster-grid" id="bookmarksGrid"></div>
        <div class="empty-state" id="bookmarksEmptyState">
          <p class="empty-title">В закладках пусто</p>
          <p class="empty-desc">Добавляйте фильмы и сериалы в закладки с экрана деталей</p>
        </div>
      </div>
    </div>

    <div class="screen screen-details" id="screenDetails">
      <header class="details-top-bar" id="detailsTopBar">
        <button class="circle-btn" id="detailsBackBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="details-top-title" id="detailsTopTitle"></span>
        <button class="circle-btn" id="detailsFavBtn">
          <svg id="detailsFavSvg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
      </header>

      <div class="details-scroll" id="detailsScroll">
        <div class="details-backdrop-wrap">
          <img class="details-backdrop-img" id="detailsBackdrop" src="" alt="">
          <div class="details-backdrop-fade"></div>
        </div>

        <div class="details-body">
          <h1 class="details-title" id="detailsTitle"></h1>
          <p class="details-original-title" id="detailsOrigTitle"></p>

          <div class="details-meta-row">
            <span class="meta-rating-badge" id="detailsRating"></span>
            <span class="meta-age-badge" id="detailsAge"></span>
            <span class="meta-item" id="detailsYear"></span>
            <span class="meta-item" id="detailsCountry"></span>
            <span class="meta-item" id="detailsDuration"></span>
          </div>

          <button class="play-btn" id="detailsPlayBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>Смотреть</span>
          </button>

          <div class="details-section">
            <h2 class="section-heading">Описание</h2>
            <p class="description-text" id="detailsDescription"></p>
          </div>

          <div class="details-section">
            <h2 class="section-heading">Жанры</h2>
            <div class="genres-flow" id="detailsGenres"></div>
          </div>

          <div class="details-section" id="detailsCastSection">
            <h2 class="section-heading">В главных ролях</h2>
            <div class="actors-carousel" id="detailsCast"></div>
          </div>

          <div class="details-section" id="detailsSimilarSection">
            <h2 class="section-heading" id="similarSectionTitle">Похожие фильмы</h2>
            <div class="similar-carousel" id="detailsSimilar"></div>
          </div>
        </div>
      </div>
    </div>

    <nav class="ios-tab-bar" id="tabBar">
      <button class="tab-button active" data-tab="home">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Главная</span>
      </button>
      <button class="tab-button" data-tab="search">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Поиск</span>
      </button>
      <button class="tab-button" data-tab="bookmarks">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Закладки</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
